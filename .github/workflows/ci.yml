name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Publish (self-contained)
      run: dotnet publish src/CrosStitchDrawingsCreator/CrosStitchDrawingsCreator.csproj -c Release --self-contained -r win-x64 -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CrosStitchDrawingsCreator-win-x64
        path: publish/
